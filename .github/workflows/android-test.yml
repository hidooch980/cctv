name: Android client checks
on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/android-test.yml"
  push:
    branches: ["feat/molido-cctv-ai-foundation"]
    paths:
      - "mobile/**"
      - ".github/workflows/android-test.yml"
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze
        working-directory: mobile
      - run: flutter test
        working-directory: mobile
      - name: Generate missing Android platform scaffolding (v2 embedding)
        run: flutter create --platforms=android --org=com.molido --project-name=molido_cctv .
        working-directory: mobile
      - run: flutter build apk --debug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with:
          name: molido-cctv-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
